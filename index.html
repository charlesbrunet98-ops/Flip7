</div>

<script>

    /* =====================================================
       COMPOSITION DU PAQUET
    ===================================================== */

    const NUMBER_CARDS = [];


    for (
        let value = 0;
        value <= 12;
        value++
    ) {

        const count =
            value === 0
                ? 1
                : value;


        NUMBER_CARDS.push({

            value: value,

            count: count

        });
    }


    const TOTAL_CARDS = 94;


    /* =====================================================
       ÉTAT
    ===================================================== */

    let myHand = [];

    let players = [];

    let playerCounter = 0;


    /* =====================================================
       NOMBRE D'EXEMPLAIRES
    ===================================================== */

    function getCardCount(value) {

        const card =
            NUMBER_CARDS.find(
                card =>
                    card.value === value
            );


        return card
            ? card.count
            : 0;
    }


    /* =====================================================
       CARTES DÉJÀ CONNUES
    ===================================================== */

    function getKnownCount(value) {

        let count = 0;


        if (
            myHand.includes(value)
        ) {

            count++;
        }


        players.forEach(
            player => {

                if (
                    player.cards.includes(value)
                ) {

                    count++;
                }

            }
        );


        return count;
    }


    /* =====================================================
       DISPONIBILITÉ
    ===================================================== */

    function canSelectCard(value) {

        return (
            getKnownCount(value) <
            getCardCount(value)
        );
    }


    /* =====================================================
       MES CARTES
    ===================================================== */

    function renderMyCards() {

        const container =
            document.getElementById(
                "myCards"
            );


        container.innerHTML = "";


        NUMBER_CARDS.forEach(
            card => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "card";


                if (
                    card.value <= 3
                ) {

                    button.classList.add(
                        "low"
                    );

                } else if (
                    card.value <= 7
                ) {

                    button.classList.add(
                        "medium"
                    );

                } else {

                    button.classList.add(
                        "high"
                    );
                }


                button.textContent =
                    card.value;


                if (
                    myHand.includes(
                        card.value
                    )
                ) {

                    button.classList.add(
                        "selected"
                    );
                }


                button.onclick =
                    function () {

                        toggleMyCard(
                            card.value
                        );

                    };


                container.appendChild(
                    button
                );

            }
        );
    }


    /* =====================================================
       TOGGLE MA MAIN
    ===================================================== */

    function toggleMyCard(value) {

        const index =
            myHand.indexOf(value);


        if (index !== -1) {

            myHand.splice(
                index,
                1
            );

        } else {

            if (
                !canSelectCard(value)
            ) {

                return;
            }


            myHand.push(value);
        }


        myHand.sort(
            (a, b) =>
                a - b
        );


        renderMyCards();

        renderMyHand();

        renderPlayers();

        updateAnalysis();
    }


    /* =====================================================
       AFFICHAGE MAIN
    ===================================================== */

    function renderMyHand() {

        const container =
            document.getElementById(
                "myHand"
            );


        container.innerHTML = "";


        if (
            myHand.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty-hand";


            empty.textContent =
                "Aucune carte sélectionnée.";


            container.appendChild(
                empty
            );


            return;
        }


        myHand.forEach(
            value => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "hand-card";


                card.textContent =
                    value;


                container.appendChild(
                    card
                );

            }
        );
    }


    /* =====================================================
       JOUEURS
    ===================================================== */

    function addPlayer() {

        playerCounter++;


        players.push({

            id:
                playerCounter,

            cards:
                []

        });


        renderPlayers();

        updateAnalysis();
    }


    function removePlayer(id) {

        players =
            players.filter(
                player =>
                    player.id !== id
            );


        renderPlayers();

        updateAnalysis();
    }


    function togglePlayerCard(
        playerId,
        value
    ) {

        const player =
            players.find(
                player =>
                    player.id === playerId
            );


        if (!player) {
            return;
        }


        const index =
            player.cards.indexOf(value);


        if (index !== -1) {

            player.cards.splice(
                index,
                1
            );

        } else {

            if (
                !canSelectCard(value)
            ) {

                return;
            }


            player.cards.push(value);
        }


        player.cards.sort(
            (a, b) =>
                a - b
        );


        renderPlayers();

        renderMyCards();

        updateAnalysis();
    }


    /* =====================================================
       AFFICHAGE JOUEURS
    ===================================================== */

    function renderPlayers() {

        const container =
            document.getElementById(
                "players"
            );


        container.innerHTML = "";


        players.forEach(
            player => {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "player";


                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "player-header";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "player-title";


                title.textContent =
                    "Joueur " +
                    player.id;


                const remove =
                    document.createElement(
                        "button"
                    );


                remove.className =
                    "player-remove";


                remove.textContent =
                    "🗑️ Supprimer";


                remove.onclick =
                    function () {

                        removePlayer(
                            player.id
                        );

                    };


                header.appendChild(
                    title
                );


                header.appendChild(
                    remove
                );


                const cards =
                    document.createElement(
                        "div"
                    );


                cards.className =
                    "player-cards";


                NUMBER_CARDS.forEach(
                    card => {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.className =
                            "player-card";


                        button.textContent =
                            card.value;


                        const selected =
                            player.cards.includes(
                                card.value
                            );


                        const available =
                            canSelectCard(
                                card.value
                            );


                        if (selected) {

                            button.classList.add(
                                "selected"
                            );
                        }


                        if (
                            !available &&
                            !selected
                        ) {

                            button.classList.add(
                                "disabled"
                            );

                            button.disabled =
                                true;
                        }


                        button.onclick =
                            function () {

                                togglePlayerCard(
                                    player.id,
                                    card.value
                                );

                            };


                        cards.appendChild(
                            button
                        );

                    }
                );


                wrapper.appendChild(
                    header
                );


                wrapper.appendChild(
                    cards
                );


                container.appendChild(
                    wrapper
                );

            }
        );
    }


    /* =====================================================
       TOTAL CARTES CONNUES
    ===================================================== */

    function getTotalKnownCards() {

        let total =
            myHand.length;


        players.forEach(
            player => {

                total +=
                    player.cards.length;

            }
        );


        return total;
    }


    /* =====================================================
       CARTES RESTANTES
    ===================================================== */

    function getRemainingNumberCards() {

        const remaining = [];


        NUMBER_CARDS.forEach(
            card => {

                const known =
                    getKnownCount(
                        card.value
                    );


                remaining.push({

                    value:
                        card.value,

                    count:
                        Math.max(
                            0,
                            card.count -
                            known
                        )

                });

            }
        );


        return remaining;
    }


    /* =====================================================
       RISQUE DE BUST
    ===================================================== */

    function calculateBustProbability() {

        const remaining =
            getRemainingNumberCards();


        const totalRemaining =
            TOTAL_CARDS -
            getTotalKnownCards();


        if (
            totalRemaining <= 0
        ) {

            return 0;
        }


        let dangerousCards = 0;


        myHand.forEach(
            value => {

                const card =
                    remaining.find(
                        card =>
                            card.value === value
                    );


                if (card) {

                    dangerousCards +=
                        card.count;
                }

            }
        );


        return (
            dangerousCards /
            totalRemaining
        );
    }


    /* =====================================================
       ESPÉRANCE
    ===================================================== */

    function calculateExpectedGain() {

        const remaining =
            getRemainingNumberCards();


        const totalRemaining =
            TOTAL_CARDS -
            getTotalKnownCards();


        if (
            totalRemaining <= 0
        ) {

            return 0;
        }


        let totalPoints = 0;


        remaining.forEach(
            card => {

                if (
                    myHand.includes(
                        card.value
                    )
                ) {

                    return;
                }


                totalPoints +=
                    card.value *
                    card.count;

            }
        );


        return (
            totalPoints /
            totalRemaining
        );
    }


    /* =====================================================
       SCORE
    ===================================================== */

    function calculateCurrentScore() {

        return myHand.reduce(
            (
                total,
                value
            ) =>
                total + value,
            0
        );
    }


    function calculateExpectedScore() {

        return (
            calculateCurrentScore() +
            calculateExpectedGain()
        );
    }


    /* =====================================================
       COULEUR DE LA BANDE
    ===================================================== */

    function updateRiskBackground(
        probability
    ) {

        const percentage =
            probability * 100;


        const stops = [

            {
                limit: 0,

                color: [
                    130,
                    240,
                    130
                ]
            },

            {
                limit: 5,

                color: [
                    190,
                    250,
                    90
                ]
            },

            {
                limit: 10,

                color: [
                    255,
                    230,
                    50
                ]
            },

            {
                limit: 20,

                color: [
                    255,
                    145,
                    30
                ]
            },

            {
                limit: 30,

                color: [
                    255,
                    40,
                    20
                ]
            },

            {
                limit: 40,

                color: [
                    255,
                    0,
                    0
                ]
            }

        ];


        let color;


        if (
            percentage >= 40
        ) {

            color =
                "rgb(255, 0, 0)";

        } else {

            for (
                let i = 0;
                i < stops.length - 1;
                i++
            ) {

                const current =
                    stops[i];


                const next =
                    stops[i + 1];


                if (
                    percentage >=
                        current.limit &&
                    percentage <=
                        next.limit
                ) {

                    const ratio =
                        (
                            percentage -
                            current.limit
                        ) /
                        (
                            next.limit -
                            current.limit
                        );


                    const r =
                        Math.round(
                            current.color[0] +
                            (
                                next.color[0] -
                                current.color[0]
                            ) *
                            ratio
                        );


                    const g =
                        Math.round(
                            current.color[1] +
                            (
                                next.color[1] -
                                current.color[1]
                            ) *
                            ratio
                        );


                    const b =
                        Math.round(
                            current.color[2] +
                            (
                                next.color[2] -
                                current.color[2]
                            ) *
                            ratio
                        );


                    color =
                        `rgb(${r}, ${g}, ${b})`;


                    break;
                }
            }
        }


        document.body.style.background =
            color;
    }


    /* =====================================================
       MESSAGE RISQUE
    ===================================================== */

    function updateRiskMessage(
        probability
    ) {

        const percentage =
            probability * 100;


        const message =
            document.getElementById(
                "riskMessage"
            );


        if (
            myHand.length === 0
        ) {

            message.innerHTML =
                "🟢 Sélectionne tes cartes pour analyser le risque.";

            return;
        }


        if (
            percentage < 10
        ) {

            message.innerHTML =
                "🟢 Risque faible";

        } else if (
            percentage < 20
        ) {

            message.innerHTML =
                "🟡 Risque modéré";

        } else if (
            percentage < 30
        ) {

            message.innerHTML =
                "🟠 Risque important";

        } else if (
            percentage < 40
        ) {

            message.innerHTML =
                "🔴 Risque élevé";

        } else {

            message.innerHTML =
                "🚨 RISQUE TRÈS ÉLEVÉ";
        }
    }


    /* =====================================================
       ANALYSE
    ===================================================== */

    function updateAnalysis() {

        const remaining =
            TOTAL_CARDS -
            getTotalKnownCards();


        const bustProbability =
            calculateBustProbability();


        const expectedGain =
            calculateExpectedGain();


        const currentScore =
            calculateCurrentScore();


        const expectedScore =
            calculateExpectedScore();


        document.getElementById(
            "remaining"
        ).textContent =
            remaining;


        document.getElementById(
            "bustProbability"
        ).textContent =
            (
                bustProbability * 100
            ).toFixed(1) +
            " %";


        document.getElementById(
            "expectedGain"
        ).textContent =
            expectedGain.toFixed(2);


        document.getElementById(
            "currentScore"
        ).textContent =
            currentScore;


        document.getElementById(
            "expectedScore"
        ).textContent =
            expectedScore.toFixed(2);


        updateRiskBackground(
            bustProbability
        );


        updateRiskMessage(
            bustProbability
        );
    }


    /* =====================================================
       VIDER MA MAIN
    ===================================================== */

    function clearSelection() {

        myHand = [];


        renderMyCards();

        renderMyHand();

        renderPlayers();

        updateAnalysis();
    }


    /* =====================================================
       NOUVELLE ANALYSE
    ===================================================== */

    function resetGame() {

        myHand = [];

        players = [];

        playerCounter = 0;


        renderMyCards();

        renderMyHand();

        renderPlayers();

        updateAnalysis();
    }


    /* =====================================================
       INITIALISATION
    ===================================================== */

    renderMyCards();

    renderMyHand();

    renderPlayers();

    updateAnalysis();

</script>
